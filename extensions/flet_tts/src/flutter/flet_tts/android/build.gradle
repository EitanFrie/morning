// Minimal Android library: only carries AndroidManifest.xml (TTS <queries>) + an empty plugin class.
group 'dev.eitan.flet_tts'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.eitan.flet_tts'
    }

    defaultConfig {
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
