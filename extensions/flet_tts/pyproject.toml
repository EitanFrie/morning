[project]
name = "flet-tts"
version = "0.1.0"
description = "Text-to-speech for Flet apps, using the phone's own voice engine (flutter_tts)."
requires-python = ">=3.10"
dependencies = ["flet>=1.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Same wheel layout as Flet's own extensions (e.g. flet-audio):
#   flet_tts/          -> the Python side
#   flutter/flet_tts/  -> the Dart side, found and compiled in by `flet build`
[tool.hatch.build.targets.wheel]
packages = ["src/flet_tts"]

[tool.hatch.build.targets.wheel.force-include]
"src/flutter" = "flutter"
