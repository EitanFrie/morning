[project]
name = "morning"
version = "0.1.0"
description = "A personal morning news feed: news flashes, NBA scores and science news in one scroll."
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.3",
    "httpx",
    "beautifulsoup4",
    "tzdata",  # timezone data for Android (Israel / New York times)
]

[dependency-groups]
dev = ["flet[all]==1.0.3"]

# ---- settings for `flet build apk` ----
[tool.flet]
org = "com.eitanfrie"
product = "Morning"
company = "Eitan"
copyright = "Eitan"

[tool.flet.app]
path = "src"
