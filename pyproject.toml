[project]
name = "morning"
version = "0.1.0"
description = "A personal morning news feed: news flashes, NBA scores and science news in one scroll."
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.3",
    "httpx",
    "beautifulsoup4",
    "tzdata",  # timezone data for Android (Israel / New York times)
    "flet-tts",  # our own extension: reading aloud with the phone's voice (extensions/flet_tts)
]

[dependency-groups]
dev = ["flet[all]==1.0.3"]

# ---- settings for `flet build apk` ----
[tool.flet]
org = "com.eitanfrie"
product = "Morning"
company = "Eitan"
copyright = "Eitan"

[tool.flet.app]
path = "src"

# Local packages installed from this repo when building the APK.
[tool.flet.dev_packages]
flet-tts = "extensions/flet_tts"

# Pin Flutter packages that broke the APK build (2026-10-06/07).
# jni_flutter's generated code needs jni >= 1.1, but something in Flet's Flutter setup resolves
# jni 1.0.0 -> "generated bindings expect package:jni ^1.1.0, but 1.0.x was imported".
# Force jni 1.1.0 (the version the last good build, v0.3.5, got).
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
