[project]
name = "morning"
version = "0.1.0"
description = "A personal morning news feed: news flashes, NBA scores and science news in one scroll."
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.3",
    "httpx",
    "beautifulsoup4",
    "tzdata",  # timezone data for Android (Israel / New York times)
]

[dependency-groups]
dev = ["flet[all]==1.0.3"]

# ---- settings for `flet build apk` ----
[tool.flet]
org = "com.eitanfrie"
product = "Morning"
company = "Eitan"
copyright = "Eitan"

[tool.flet.app]
path = "src"

# Pin Flutter packages that broke the APK build.
# jni_flutter 1.0.4+1 (published 2026-10-06) needs jni ^1.1.0 but Flet resolves jni 1.0.x
# -> "generated bindings expect package:jni ^1.1.0". 1.0.4 is the last version that built.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.4"
