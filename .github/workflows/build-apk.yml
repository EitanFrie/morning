# Builds the Android APK in the cloud (no Android Studio needed on your PC).
#
#  - Every push of a version tag (e.g. `git tag v0.2.0 && git push --tags`)
#    builds the APK and attaches it to a GitHub Release.
#    Obtainium on the phone watches those releases and installs updates.
#  - You can also start a build by hand: GitHub -> Actions -> "Build APK" -> Run workflow.

name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet[all]==1.0.3"

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          # arm64 only: every modern phone/tablet, and a much smaller APK
          flet build apk --yes --arch arm64-v8a \
            --android-permissions android.permission.INTERNET=True \
            --build-version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: morning-apk
          path: build/apk/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
