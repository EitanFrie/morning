# Builds the Android APK in the cloud (no Android Studio needed on your PC).
#
#  - Every push of a version tag (e.g. `git tag v0.2.0 && git push --tags`)
#    builds the APK and attaches it to a GitHub Release.
#    Obtainium on the phone watches those releases and installs updates.
#  - You can also start a build by hand: GitHub -> Actions -> "Build APK" -> Run workflow.

name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet[all]==1.0.3"

      - name: Build APK
        env:
          # One fixed signing key (GitHub secrets) -> every new APK installs over the old one.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "$VERSION" > src/version.txt   # the app reads this to check for updates
          SIGNING=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morning.p12"
            SIGNING=(--android-signing-key-store "$RUNNER_TEMP/morning.p12"
                     --android-signing-key-store-password "$KEYSTORE_PASSWORD"
                     --android-signing-key-password "$KEYSTORE_PASSWORD"
                     --android-signing-key-alias "$KEY_ALIAS")
          else
            echo "::warning::No signing secrets - APK signed with a temporary key"
          fi
          # arm64 only: every modern phone/tablet, and a much smaller APK
          set +e
          flet build apk --yes --arch arm64-v8a --no-rich-output \
            --android-permissions android.permission.INTERNET=True \
            --build-version "$VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            "${SIGNING[@]}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Logs need a login to read; annotations are public - so put the error there.
            msg=$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flet build failed::$msg"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: morning-apk
          path: build/apk/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
